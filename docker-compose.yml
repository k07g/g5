services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: g5
      POSTGRES_PASSWORD: g5
      POSTGRES_DB: g5
    ports:
      # Host port 5434 avoids clashing with a Postgres instance that may
      # already be listening on the default 5432, or with g4's own local
      # instance on 5433 (github.com/k07g/g4).
      - "5434:5432"
    volumes:
      - g5-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g5 -d g5"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  g5-postgres-data:
